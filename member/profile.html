<main id="main-content" class="dashboard-shell"><div class="container narrow-container"><p class="eyebrow">Member profile</p><h1>Personal details</h1><p>Keep your information current so MMS Sports Center can support your membership safely.</p><form id="profile-form" class="form-card" novalidate><div class="form-row"><div class="form-group"><label for="name">Full name</label><input id="name" name="name" type="text" minlength="2" maxlength="80" required></div><div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" readonly aria-describedby="email-help"><small id="email-help" class="helper-text">The registered email cannot be changed in this prototype.</small></div></div><div class="form-row"><div class="form-group"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" maxlength="25" pattern="[0-9+() -]{7,25}" placeholder="e.g. +44 7700 900000"></div><div class="form-group"><label for="dateOfBirth">Date of birth</label><input id="dateOfBirth" name="dateOfBirth" type="date"></div></div><div class="form-group"><label for="emergencyContact">Emergency contact</label><input id="emergencyContact" name="emergencyContact" type="text" maxlength="120" placeholder="Name and phone number"></div><button class="button" type="submit">Save profile</button><p class="form-message" role="status" aria-live="polite"></p></form></div></main><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script><script src="../js/firebase-config.js"></script><script src="../js/auth.js"></script><script src="../js/profile.js"></script><script src="../js/main.js"></script></body></html>
