<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create an MMS Sports Center member account."><title>Register | MMS Sports Center</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="assets/icons/mms-icon.svg">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/accessibility.css"></head><body><a class="skip-link" href="#main-content">Skip to main content</a><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html" aria-label="MMS Sports Center home"><span class="brand-mark">MMS</span><span>MMS Sports Center</span></a><a href="index.html">Back to home</a></div></header><main id="main-content" class="auth-shell"><form id="register-form" class="auth-card" novalidate><p class="eyebrow">Membership</p><h1>Create your account</h1><p>Your password is securely handled by Firebase Authentication. We never store your password in the website.</p><div class="form-group"><label for="name">Full name</label><input id="name" name="name" required minlength="2" maxlength="80" autocomplete="name"></div><div class="form-group"><label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="120" autocomplete="email"></div><div class="form-group"><label for="password">Password</label><input id="password" name="password" type="password" required minlength="8" maxlength="100" autocomplete="new-password" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Use at least 8 characters with a letter and number"><div class="password-meter" aria-hidden="true"><span></span></div><p class="helper-text">Strength: <span id="password-strength">Very weak</span>. Use letters and numbers; symbols are recommended.</p></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" required minlength="8" autocomplete="new-password"></div><div class="form-group"><label for="plan">Preferred plan</label><select id="plan" name="plan" required><option value="">Choose a plan</option><option value="Starter">Starter</option><option value="Active">Active</option><option value="Complete">Complete</option></select></div><div class="form-group checkbox-row"><input id="terms" name="terms" type="checkbox" required><label for="terms">I agree to the demonstration terms and privacy notice.</label></div><button class="button button-block" type="submit">Create account</button><p class="form-message" aria-live="polite"></p><p class="helper-text">Already registered? <a href="login.html">Login here</a>.</p></form></main><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script><script src="js/firebase-config.js"></script><script src="js/auth.js"></script><script src="js/main.js"></script></body></html>
